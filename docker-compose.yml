# lume-crm 容器编排
#
# 本地验证:  docker compose up --build  → http://127.0.0.1:11080 (无认证)
# 公网部署(lume-crm.erishen.cn): 用下面的 ports 改绑 127.0.0.1 交给反代,
#   并务必开启认证(取消 LUME_AUTH_* / HTPASSWD_FILE 注释 + 强密码),
#   外层用 nginx/caddy 做反代 + TLS(见部署说明)。
services:
  crm:
    build: .
    image: lume-crm:latest
    ports:
      - "11080:8089"          # 本地验证(宿主侧 >10000 且非 Chrome 受限端口); 公网改为 "127.0.0.1:11080:8089"
    environment:
      LUME_BIND: "0.0.0.0"     # 容器内需 0.0.0.0 才能被端口映射命中
      # ---- 真实 LLM(OpenAI 兼容; 不配 LLM_API_KEY 则聊天走离线演示引擎) ----
      # key 不写这里(会入库): 放同目录 .env(gitignored), compose 用 ${LLM_API_KEY}
      # 变量替换注入。URL 指向本机 本机 LLM 网关 网关; host.docker.internal 由 musl curl
      # 解析, alpine 下可用(实测 lume-invest 同款部署跑通)。
      LLM_API_URL: "http://host.docker.internal:<port>/v1/chat/completions"
      LLM_MODEL: "auto"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      # ---- 只读演示模式(公网推荐, 默认开) ----
      # 写 API 全部 403 + Agent 只注册查询类工具(注入也无破坏面), 无鉴权也可公网演示。
      # 本地开发想可写: 注释掉这行, 或 `LUME_CRM_READONLY= docker compose up`。
      LUME_CRM_READONLY: "1"
      # ---- 公网部署可选(要可写演示才需要; 只读模式下无需鉴权) ----
      # LUME_AUTH_USER: "admin"
      # LUME_AUTH_PASSWORD: "改成强密码"
      # HTPASSWD_FILE: "/app/auth/htpasswd"
    volumes:
      - crm_data:/app/.data    # SQLite 持久化
    restart: unless-stopped

volumes:
  crm_data:
