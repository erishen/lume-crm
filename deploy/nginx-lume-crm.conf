# lume-crm.erishen.cn —— 反代到 lume-crm 容器(127.0.0.1:8089) + Basic Auth + TLS
#
# 为什么鉴权放在这里而不是 lume 内置 htpasswd:
#   经实测, lume 发布版二进制对自定义 /api/* 路由未强制 Basic Auth(只对内置
#   路由生效), 而 CRM 的 /api/customers 等全是自定义路由、且聊天工具能读写
#   .data/crm.db。公网裸暴露 = 任何人可 CRUD。故在反代层全员挡一层 Basic Auth
#   是必需, lume 内置的 LUME_AUTH_PASSWORD 仅作纵深防御。
#
# 前置:
#   1. DNS: lume-crm.erishen.cn A 记录指向本机公网 IP
#   2. TLS:  certbot certonly --webroot -w /var/www/letsencrypt \
#             -d lume-crm.erishen.cn
#   3. 账号: htpasswd -c /etc/nginx/lume-crm.htpasswd admin   (按需加更多)
#   4. 容器: docker run -d --restart unless-stopped --name lume-crm \
#             -p 127.0.0.1:8089:8089 -e LUME_BIND=0.0.0.0 lume-crm:latest
#           (只绑 127.0.0.1, 由本反代转发; 端口不对外直开)

server {
    listen 80;
    server_name lume-crm.erishen.cn;
    # certbot http-01 校验目录
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name lume-crm.erishen.cn;

    ssl_certificate     /etc/letsencrypt/live/lume-crm.erishen.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lume-crm.erishen.cn/privkey.pem;
    # 加固建议(按需): ssl_protocols TLSv1.2 TLSv1.3;
    #   ssl_ciphers HIGH:!aNULL:!MD5; ssl_session_cache shared:SSL:10m;

    # 全员 Basic Auth:CRM 无自身账号体系, 公网必须挡一层
    auth_basic "Lume CRM";
    auth_basic_user_file /etc/nginx/lume-crm.htpasswd;

    # SPA history 路由的回落由 lume(server{ spa=true })在服务端处理,
    # 这里把全部请求透传即可; Accept:text/html 的 404 会回落 index.html。
    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # 聊天 SSE 可能长时
    }
}
