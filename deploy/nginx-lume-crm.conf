# lume-crm.erishen.cn —— 反代到 lume-crm 容器(127.0.0.1:8089) + Basic Auth + TLS
#
# 端口口径: VPS 统一用 8089(compose 默认 HOST_PORT=8089 / docker run
#   -p 127.0.0.1:8089:8089);本地联调若 8089 被占用才设 HOST_PORT=11080。
#
# 为什么鉴权放在这里而不是 lume 内置 htpasswd:
#   lume v0.8.1 的 Basic Auth 是**全局**的(实测自定义 /api/*、/share/ 也会
#   401),没有 per-route 例外。而分享页必须对拿到 token 的外部客户开放,所以
#   认证放在反代层,给 /share/ 单独 auth_basic off;容器内不要再开
#   LUME_AUTH_PASSWORD/HTPASSWD_FILE,否则 /share/ 仍会被 lume 拦成 401。
#   (旧版 lume 曾出现自定义路由绕过内置 Basic 的情况,已不能依赖;反代层是
#   唯一可靠的门。)
#
# 前置:
#   1. DNS: lume-crm.erishen.cn A 记录指向本机公网 IP
#   2. TLS:  certbot certonly --webroot -w /var/www/letsencrypt -d lume-crm.erishen.cn
#   3. 账号: htpasswd -c /etc/nginx/lume-crm.htpasswd admin   (≥20 位随机密码, 不复用)
#   4. 容器: docker run -d --restart unless-stopped --name lume-crm \
#             -p 127.0.0.1:8089:8089 -e LUME_BIND=0.0.0.0 lume-crm:latest
#   5. 加固: 主 nginx.conf 的 http{} 需能加载本目录 nginx-lume-crm-zones.conf
#             (limit_req_zone / map pin 打码), 详见 docs/HARDENING.md

server {
    listen 80;
    server_name lume-crm.erishen.cn;
    # HTTP 301 也可能带 ?token=; 用同一打码格式,别落到默认 access.log。
    access_log /var/log/nginx/lume-crm.access.log crm_crm;
    # certbot http-01 校验目录(限流/加固不作用于校验, 保持开放)
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name lume-crm.erishen.cn;

    ssl_certificate     /etc/letsencrypt/live/lume-crm.erishen.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lume-crm.erishen.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # ---- 安全响应头(纵深防御: XSS / MIME 嗅探 / 点击劫持 / 敏感头泄露)----
    # 注意: 下面 location 里**不再**写 add_header, 否则 server 级这组安全头
    # 会因 nginx 的 add_header 继承规则(某层出现 add_header 即停止继承上层)
    # 而丢失。唯一例外是 @crm_ratelimit, 它重复了下面这组头。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # ---- 连接级上限(防单 IP 耗尽 worker; 容器 workers=2, 20/客户端充足)----
    limit_conn crm_conn 20;

    # 限流/限连接命中时返回 429(默认 503), 统一交给下面的 error_page 429 处理
    limit_req_status 429;
    limit_conn_status 429;

    # 全员 Basic Auth:CRM 无自身账号体系, 公网必须挡一层
    auth_basic "Lume CRM";
    auth_basic_user_file /etc/nginx/lume-crm.htpasswd;

    # 访问日志: 用 crm_crm 格式(zones.conf 定义), 自动把 ?pin=*** 打码
    access_log /var/log/nginx/lume-crm.access.log crm_crm;

    # 429 统一走 named location, 带 Retry-After。注意: nginx 里某层一旦出现
    # add_header 就不再继承上层 add_header, 所以这里必须**重复** server 级的
    # 安全头, 否则 429 响应会丢失 HSTS/CSP 等(改 server 级安全头时同步本块)。
    error_page 429 @crm_ratelimit;
    location @crm_ratelimit {
        default_type text/plain;
        add_header Retry-After 2 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        return 429 "too many requests, slow down\n";
    }

    # robots.txt 必须对爬虫公开(否则 Basic 挡住它, Disallow 形同虚设);
    # 真正的防索引仍靠分享页的 X-Robots-Tag / meta robots。
    location = /robots.txt {
        auth_basic off;
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 普通路径: 5 r/s + burst 20(防字典爆破 / 爬虫爬库)
    location / {
        limit_req zone=crm429 burst=20 nodelay;
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 覆盖客户端自带的 XFF，避免伪造 IP 进入应用/统计；应用只信 X-Real-IP。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # 聊天 SSE 可能长时
    }

    # 客户分享页: 额外 10 次/分钟, 防 /share/customer?id=N 枚举爬全库。
    # 应用层还要求 ?token=(share_links 校验: TTL/撤销/版本; 见 src/db.lume);
    # 这里 auth_basic off 让拿到 token 的外部客户可直接打开(否则"分享"无意义)。
    # 无 token / 不对 / 过期 / 撤销一律 404, 且 token 已在日志里打码。
    location /share/ {
        auth_basic off;
        limit_req zone=crm429 burst=20 nodelay;
        limit_req zone=crm-share burst=5 nodelay;
        # 分享页:lume 路由响应已带 Referrer-Policy: no-referrer、XFO、CSP、
        # X-Content-Type-Options;这里只补应用没有的 HSTS/Permissions。
        # 注意 add_header 继承规则:本 location 一旦出现 add_header,就不再
        # 继承 server 级的 strict-origin Referrer-Policy,正好让应用的
        # no-referrer 生效。不要再重复 XFO/CSP/Referrer,否则出现双头。
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 覆盖客户端自带的 XFF，避免伪造 IP 进入应用/统计；应用只信 X-Real-IP。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
