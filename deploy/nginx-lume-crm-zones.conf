# ============================================================================
# lume-crm 加固 — http{} 层共享 zone(须放入主 /etc/nginx/nginx.conf 的
# http { } 块内, 通过 include 引入; server 块内无法再定义 zone)。
#
# 用法(在 /etc/nginx/nginx.conf 的 http { } 里):
#     # shared limits + crm security zones
#     include /etc/nginx/conf.d/lume-crm-zones.conf;
# 之后再 include 本目录的 nginx-lume-crm.conf(server 块)。
#
# 引入后跑 `nginx -t && systemctl reload nginx`。
# ============================================================================

# --- 429 限流 zone(按源 IP)---
#   crm429    : 普通请求 5 r/s, 队列 20(防字典爆破/爬虫爬库)
#   crm-share : 分享页单 IP 10 次/分钟(防 ID 枚举爬全库)
#   注意: limit_req_zone 没有 status= 参数; 429 状态由 server 块的
#   `limit_req_status 429;` 指定, 再经 `error_page 429` 走 @crm_ratelimit
#   (带 Retry-After), 而不是默认 503。
limit_req_zone $binary_remote_addr zone=crm429:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=crm-share:10m rate=10r/m;

# --- 连接数上限(防单 IP 长连接耗尽 worker, workers=2 场景下 20/客户端够用)---
limit_conn_zone $binary_remote_addr zone=crm_conn:10m;

# --- 访问日志打码:把 ?pin= / ?token= 的敏感值从 access log 里隐去 ---
#   主 nginx.conf 若已有全局 log_format, 本定义仅对本 server 生效
#   (nginx-lume-crm.conf 里用 access_log ... crm_crm; 指定)。
# Referer 也可能带 ?token=(从分享页点外链/浏览器取 favicon):凡出现
# pin/token 参数就整段隐去,避免从 Referer 绕过下面的 URI 打码。
map $http_referer $http_referer_masked {
    default               $http_referer;
    ~*[?&](pin|token)=    "[redacted]";
}

log_format crm_crm '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $request_uri_masked $server_protocol" '
                  '$status $body_bytes_sent '
                  '"$http_referer_masked" "$http_user_agent"';

# 用 map 把 URL 里的 pin / token 参数打码(nginx map 支持正则)。
#   关键: 捕获前缀/后缀并原样拼回, 否则 map 会用替换串覆盖**整个** URI,
#   access log 只剩 `&token=***`, 路径与 id 全丢(调试/审计不可用)。
#   每种参数串两段 map: 第一段用贪婪前缀打码**最后**一个匹配, 第二段用
#   懒惰前缀打码**第一个**, 两段合起来覆盖 `?pin=a&pin=b` 这类重复参数
#   (三个以上重复仍会漏中间值, 靠废弃 query fallback / 走 header 规避)。
#   注意: /share/customer 的 token 是访问凭据, 泄露到日志等于泄露分享链接。
map $request_uri $request_uri_pin1 {
    default                                    $request_uri;
    ~*^(.*[?&]pin=)[^&\s]*(.*)$               "$1***$2";
}
map $request_uri_pin1 $request_uri_pin2 {
    default                                    $request_uri_pin1;
    ~*^(.*?[?&]pin=)[^&\s]*(.*)$              "$1***$2";
}
map $request_uri_pin2 $request_uri_token1 {
    default                                    $request_uri_pin2;
    ~*^(.*[?&]token=)[^&\s]*(.*)$             "$1***$2";
}
map $request_uri_token1 $request_uri_masked {
    default                                    $request_uri_token1;
    ~*^(.*?[?&]token=)[^&\s]*(.*)$            "$1***$2";
}
